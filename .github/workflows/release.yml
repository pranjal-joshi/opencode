name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build ZIP
        run: |
          cd custom_components/opencode
          zip -r ../../opencode.zip . \
            --exclude "*/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "*.pyo"

      - name: Verify ZIP contents
        run: |
          echo "ZIP contents:"
          python3 -c "
          import zipfile
          with zipfile.ZipFile('opencode.zip') as z:
            for info in z.infolist():
              print(f'  {info.filename} ({info.file_size} bytes)')
          "

          echo ""
          echo "Checking manifest version:"
          python3 -c "
          import zipfile, json
          with zipfile.ZipFile('opencode.zip') as z:
            manifest = json.loads(z.read('manifest.json'))
            print(f'  version: {manifest[\"version\"]}')
            print(f'  domain: {manifest[\"domain\"]}')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: opencode.zip
          name: "Release ${{ github.ref_name }}"
          body: |
            ## ✨ Real token streaming

            The conversation agent now streams responses token-by-token. Requests are
            sent with `stream=True` and content deltas are forwarded to Home Assistant
            as they arrive, so replies appear live in the conversation UI instead of
            after the whole message has been generated. AI Task (structured data)
            requests stream as well.

            If a model or provider does not support streaming, the integration
            automatically retries the request without streaming, so nothing breaks.

            ## 🐛 Bug Fixes

            ### Home Assistant 2026.9 compatibility

            Fixes the integration failing to load on Home Assistant **2026.9.0b4 and
            later** with:

            ```
            ModuleNotFoundError: No module named 'voluptuous_openapi'
            ```

            Home Assistant 2026.9 dropped `voluptuous-openapi` from core requirements
            and replaced it with [`probatio`](https://github.com/frenck/probatio), which
            now provides the schema-to-OpenAPI conversion used when exposing Home
            Assistant tools to the model.

            The integration now imports `probatio.to_openapi` when it is available and
            falls back to `voluptuous_openapi.convert` otherwise, so this release works
            on both **2026.9+** and **2026.8 and earlier**.

            No configuration changes are required — update and restart Home Assistant.

            **Full Changelog**: https://github.com/pranjal-joshi/opencode/compare/v1.0.1...${{ github.ref_name }}